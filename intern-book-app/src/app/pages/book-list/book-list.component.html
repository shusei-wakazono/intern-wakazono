<div class="page-container">
  <mat-card class="book-card">
    <div class="card-inner">
      <h2 class="card-title">書籍登録</h2>

      <div class="form-fields">
        <mat-form-field appearance="fill" class="input-medium">
          <input matInput placeholder="書籍名" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-medium">
          <textarea
            matInput
            placeholder="あらすじ"
            rows="2"
            readonly
          ></textarea>
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-small">
          <input matInput placeholder="評価点" readonly />
        </mat-form-field>
      </div>

      <div class="card-actions">
        <button mat-raised-button color="primary">追加</button>
      </div>
    </div>
  </mat-card>
  <div class="book-list">
    <mat-card *ngFor="let book of bookList" class="book-card">
      <div class="card-inner">
        <h2 class="book-name">{{ book.name }}</h2>
        <p class="book-detail">{{ book.detail }}</p>
        <p class="book-evaluation">評価: {{ book.evaluation }}点</p>
        <div class="card-actions">
          <button mat-raised-button color="warn">削除</button>
        </div>
      </div>
    </mat-card>
  </div>
</div>
