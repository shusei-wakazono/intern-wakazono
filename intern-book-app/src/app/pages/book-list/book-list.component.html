<div class="page-container">
  <mat-card class="book-card">
    <div class="card-inner">
      <h2 class="card-title">書籍登録</h2>

      <div class="form-fields">
        <mat-form-field appearance="fill" class="input-medium">
          <mat-label>書籍名</mat-label>
          <input matInput [(ngModel)]="newTitle" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-medium">
          <mat-label>あらすじ</mat-label>
          <textarea matInput [(ngModel)]="newSummary" rows="2"></textarea>
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-small">
          <mat-label>評価点</mat-label>
          <input matInput type="number" [(ngModel)]="newScore" />
        </mat-form-field>
      </div>

      <div class="card-actions">
        <button mat-raised-button color="primary" (click)="addBook()">
          追加
        </button>
      </div>
    </div>
  </mat-card>

  @if (books.length === 0) {
    <p class="no-data-text">データがありません</p>
  } @else {
    <div class="book-list">
      @for (book of books; track book.id) {
        <mat-card class="book-card">
          <div class="card-inner">
            <h2 class="book-title">{{ book.title }}</h2>
            <p class="book-summary">{{ book.summary }}</p>
            <p class="book-score">評価: {{ book.score }}点</p>
            <div class="card-actions">
              <button
                mat-raised-button
                color="warn"
                (click)="deleteBook(book.id)"
              >
                削除
              </button>
            </div>
          </div>
        </mat-card>
      }
    </div>
  }
</div>
