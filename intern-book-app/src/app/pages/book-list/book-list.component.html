<div class="page-container">
  <mat-card class="book-card">
    <div class="card-inner">
      <h2 class="card-title">書籍登録</h2>

      <div class="form-fields">
        <mat-form-field appearance="fill" class="input-medium">
          <input matInput placeholder="書籍名" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-medium">
          <textarea
            matInput
            placeholder="あらすじ"
            rows="2"
            readonly
          ></textarea>
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-small">
          <input matInput placeholder="評価点" readonly />
        </mat-form-field>
      </div>

      <div class="card-actions">
        <button mat-raised-button color="primary">追加</button>
      </div>
    </div>
  </mat-card>

  <div class="book-list">
    <mat-card class="book-card">
      <div class="card-inner">
        <h2 class="book-title">アンドロイドは電気羊の夢を見るか？</h2>
        <p class="book-summary">
          第三次大戦後の未来、サンフランシスコを舞台に賞金稼ぎのリック・デッカードが、火星から逃亡してきた8体のアンドロイドを「処理」するというあらすじ
        </p>
        <p class="book-score">評価: 90点</p>
        <div class="card-actions">
          <button mat-raised-button color="warn">削除</button>
        </div>
      </div>
    </mat-card>

    <mat-card class="book-card">
      <div class="card-inner">
        <h2 class="book-title">岩田さん: 岩田聡はこんなことを話していた。</h2>
        <p class="book-summary">
          任天堂の元社長、岩田聡さんのことばをまとめた本
        </p>
        <p class="book-score">評価: 90点</p>
        <div class="card-actions">
          <button mat-raised-button color="warn">削除</button>
        </div>
      </div>
    </mat-card>
  </div>
</div>
